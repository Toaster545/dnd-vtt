@if (loading()) {
  <div class="h-full w-full flex items-center justify-center">
    <span class="spinner-lg"></span>
  </div>
} @else if (error()) {
  <div class="h-full w-full flex items-center justify-center text-danger text-sm px-4 text-center">
    {{ error() }}
  </div>
} @else if (encounter(); as e) {
  @if (e.map_id) {
    <app-battle-map [mapIdInput]="e.map_id" [embedded]="true" [canControl]="false"
      [characterHp]="characterHp()" [characterPortraits]="characterPortraits()"
      [currentTurnTokenId]="currentTurnTokenId()" class="block h-full w-full" />
  } @else {
    <div class="h-full w-full flex items-center justify-center text-slate text-sm px-4 text-center">
      No map attached to this encounter yet.
    </div>
  }
}
