@if (character(); as c) {
  <app-character-play-sheet class="flex-1 min-h-0" [character]="c" (saved)="onSaved($event)">
    <div sheetHeaderLeading class="flex items-center gap-1">
      <button class="btn-icon" (click)="close()" matTooltip="Back to characters">
        <mat-icon>arrow_back</mat-icon>
      </button>
      @if (c.campaign_id) {
        <button class="btn-icon" (click)="openCampaign()" matTooltip="Open campaign">
          <mat-icon>groups</mat-icon>
        </button>
      }
    </div>
  </app-character-play-sheet>
} @else {
  <div class="flex-1 flex items-center justify-center">
    <span class="spinner-lg"></span>
  </div>
}
