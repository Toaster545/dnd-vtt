@if (ready()) {
  <app-character-wizard class="flex flex-col flex-1 min-h-0"
    [character]="character()"
    [levelUp]="true"
    (saved)="onDone()"
    (cancelled)="onCancelled()"
  />
} @else {
  <div class="flex-1 flex items-center justify-center">
    <span class="spinner-lg"></span>
  </div>
}
