<div class="flex flex-col h-screen">
  <header class="app-toolbar">
    <span class="toolbar-title flex-1">D&amp;D Campaign</span>
    <span class="text-sm text-slate mr-2">{{ auth.profile()?.username }}</span>
    <button class="btn-icon" (click)="auth.signOut()" matTooltip="Sign out">
      <mat-icon>logout</mat-icon>
    </button>
  </header>

  <main class="flex-1 p-6 overflow-auto">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-2xl">
      <a routerLink="/player"
         class="card p-6 flex flex-col items-center gap-3 hover:border-white/25 transition-colors cursor-pointer no-underline">
        <mat-icon class="text-gold" style="font-size: 2.5rem; width: 2.5rem; height: 2.5rem;">person</mat-icon>
        <h3 class="font-brand text-parchment m-0">Player Area</h3>
        <p class="text-sm text-slate text-center m-0">Create characters and join an encounter</p>
      </a>
    </div>
  </main>
</div>
