<div class="absolute top-2 left-2 flex gap-1 bg-surface/90 rounded p-1 border border-white/10">
  <button class="btn-icon w-8 h-8" [class.border-gold/50]="!activeMeasureTool() && !activeFogTool()" [class.bg-gold/5]="!activeMeasureTool() && !activeFogTool()"
          (click)="selectPointerTool.emit()" matTooltip="Select / move">
    <mat-icon class="text-base">near_me</mat-icon>
  </button>
  <button class="btn-icon w-8 h-8" [class.border-gold/50]="activeMeasureTool() === 'line'" [class.bg-gold/5]="activeMeasureTool() === 'line'"
          (click)="measureToolToggled.emit('line')" matTooltip="Measure: line">
    <mat-icon class="text-base">straighten</mat-icon>
  </button>
  <button class="btn-icon w-8 h-8" [class.border-gold/50]="activeMeasureTool() === 'cone'" [class.bg-gold/5]="activeMeasureTool() === 'cone'"
          (click)="measureToolToggled.emit('cone')" matTooltip="Measure: cone">
    <mat-icon class="text-base">change_history</mat-icon>
  </button>
  <button class="btn-icon w-8 h-8" [class.border-gold/50]="activeMeasureTool() === 'sphere'" [class.bg-gold/5]="activeMeasureTool() === 'sphere'"
          (click)="measureToolToggled.emit('sphere')" matTooltip="Measure: sphere">
    <mat-icon class="text-base">circle</mat-icon>
  </button>
  @if (hasMyToken()) {
    <button class="btn-icon w-8 h-8 ml-1" [class.border-gold/50]="showMoveRange()" [class.bg-gold/5]="showMoveRange()"
            (click)="moveRangeToggled.emit()" matTooltip="Show my movement range">
      <mat-icon class="text-base">directions_walk</mat-icon>
    </button>
  }

  @if (isAdmin()) {
    <div class="w-px bg-white/10 mx-1"></div>
    <button class="btn-icon w-8 h-8" [class.border-gold/50]="fogEnabled()" [class.bg-gold/5]="fogEnabled()"
            (click)="fogEnabledToggled.emit()" matTooltip="Fog of war: on/off (map starts fully visible)">
      <mat-icon class="text-base">{{ fogEnabled() ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
    <button class="btn-icon w-8 h-8" [class.border-gold/50]="activeFogTool() === 'hide-brush'" [class.bg-gold/5]="activeFogTool() === 'hide-brush'"
            (click)="fogToolToggled.emit('hide-brush')" matTooltip="Fog brush: hide">
      <mat-icon class="text-base">brightness_3</mat-icon>
    </button>
    <button class="btn-icon w-8 h-8" [class.border-gold/50]="activeFogTool() === 'reveal-brush'" [class.bg-gold/5]="activeFogTool() === 'reveal-brush'"
            (click)="fogToolToggled.emit('reveal-brush')" matTooltip="Fog brush: reveal">
      <mat-icon class="text-base">brightness_7</mat-icon>
    </button>
    <button class="btn-icon w-8 h-8" [class.border-gold/50]="activeFogTool() === 'hide-rect'" [class.bg-gold/5]="activeFogTool() === 'hide-rect'"
            (click)="fogToolToggled.emit('hide-rect')" matTooltip="Fog rectangle: hide">
      <mat-icon class="text-base">stop</mat-icon>
    </button>
    <button class="btn-icon w-8 h-8" [class.border-gold/50]="activeFogTool() === 'reveal-rect'" [class.bg-gold/5]="activeFogTool() === 'reveal-rect'"
            (click)="fogToolToggled.emit('reveal-rect')" matTooltip="Fog rectangle: reveal">
      <mat-icon class="text-base">crop_square</mat-icon>
    </button>
    <button class="btn-icon w-8 h-8" (click)="revealAllFog.emit()" matTooltip="Reveal entire map">
      <mat-icon class="text-base">restart_alt</mat-icon>
    </button>
  }
</div>
