<div class="flex flex-col h-screen">
  <header class="app-toolbar">
    <span class="toolbar-title">D&amp;D Campaign</span>

    <nav class="flex gap-1 mx-auto">
      <button class="btn-ghost text-sm gap-1.5"
              [class.bg-white/10]="activeTab() === 'create'"
              (click)="selectTab('create')">
        <mat-icon class="text-base">create</mat-icon> Create
      </button>

      <button class="btn-ghost text-sm gap-1.5"
              [class.bg-white/10]="activeTab() === 'play'"
              (click)="selectTab('play')">
        <mat-icon class="text-base">person</mat-icon> Characters
      </button>

      <button class="btn-ghost text-sm gap-1.5"
              [class.bg-white/10]="activeTab() === 'campaigns'"
              (click)="goToCampaigns()">
        <mat-icon class="text-base">groups</mat-icon> Campaigns
      </button>
    </nav>

    <div class="flex items-center gap-2 ml-auto">
      <span class="text-sm text-slate">{{ auth.profile()?.username }}</span>
      <span class="toolbar-badge">DM</span>
      <button class="btn-icon" (click)="auth.signOut()" matTooltip="Sign out">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </header>

  <div class="flex-1 overflow-hidden flex flex-col min-h-0">
    @switch (activeTab()) {
      @case ('create') {
        <app-dm-create class="flex-1 min-h-0" />
      }
      @case ('play') {
        <app-dm-play class="flex-1 min-h-0" />
      }
      @case ('campaigns') {
        <div class="flex-1 min-h-0 overflow-hidden flex flex-col">
          <router-outlet></router-outlet>
        </div>
      }
    }
  </div>
</div>
