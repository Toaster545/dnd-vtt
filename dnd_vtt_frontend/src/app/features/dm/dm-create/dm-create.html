<div class="flex h-full overflow-hidden">
  <!-- Sidebar nav -->
  <nav class="w-48 border-r border-white/10 py-2 flex-shrink-0">
    <button class="nav-item" [class.active]="activeSection() === 'characters'" (click)="activeSection.set('characters')">
      <mat-icon class="text-lg">person</mat-icon>
      Characters
    </button>
    <button class="nav-item" [class.active]="activeSection() === 'sessions'" (click)="activeSection.set('sessions')">
      <mat-icon class="text-lg">event_note</mat-icon>
      Sessions
    </button>
    <button class="nav-item" [class.active]="activeSection() === 'encounters'" (click)="activeSection.set('encounters')">
      <mat-icon class="text-lg">sports_martial_arts</mat-icon>
      Encounters
    </button>
    <button class="nav-item" [class.active]="activeSection() === 'items'" (click)="activeSection.set('items')">
      <mat-icon class="text-lg">backpack</mat-icon>
      Items
    </button>
    <button class="nav-item" [class.active]="activeSection() === 'spells'" (click)="activeSection.set('spells')">
      <mat-icon class="text-lg">auto_fix_high</mat-icon>
      Spells
    </button>
  </nav>

  <!-- Content -->
  <div class="flex-1 overflow-auto p-6">
    @switch (activeSection()) {
      @case ('characters') { <app-dm-characters /> }
      @case ('sessions')   { <app-dm-sessions /> }
      @case ('encounters') {
        <h2 class="font-brand text-lg text-parchment mb-3">Encounters</h2>
        <p class="text-slate text-sm">Encounters coming soon.</p>
      }
      @case ('items') {
        <h2 class="font-brand text-lg text-parchment mb-3">Items</h2>
        <p class="text-slate text-sm">Items coming soon.</p>
      }
      @case ('spells') {
        <h2 class="font-brand text-lg text-parchment mb-3">Spells</h2>
        <p class="text-slate text-sm">Spells coming soon.</p>
      }
    }
  </div>
</div>
