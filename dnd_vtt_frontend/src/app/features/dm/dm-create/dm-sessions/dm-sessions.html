<div class="flex items-center gap-3 mb-5">
  <h2 class="font-brand text-lg text-parchment m-0 flex-1">Sessions</h2>
  <button class="btn-outline text-sm" (click)="showForm.set(!showForm())">
    {{ showForm() ? 'Cancel' : '+ New Session' }}
  </button>
</div>

@if (showForm()) {
  <div class="card card-body mb-4 max-w-lg">
    <form (ngSubmit)="createSession()" class="flex flex-col gap-3">
      <div class="field">
        <label class="field-label">Session name</label>
        <input class="field-input" [(ngModel)]="newName" name="name" required autofocus />
      </div>
      <div class="field">
        <label class="field-label">Description (optional)</label>
        <textarea class="field-input" [(ngModel)]="newDescription" name="description" rows="3"></textarea>
      </div>
      <div>
        <button class="btn-primary" type="submit" [disabled]="!newName.trim() || saving()">
          @if (saving()) { <span class="spinner-sm"></span> } @else { Create Session }
        </button>
      </div>
    </form>
  </div>
}

<ul class="divide-y divide-white/8">
  @for (session of sessions(); track session.id) {
    <li class="flex items-center py-3 gap-3">
      <div class="flex-1 min-w-0">
        <p class="text-parchment font-medium truncate m-0">{{ session.name }}</p>
        <p class="text-slate text-xs m-0 mt-0.5">{{ formatDate(session.created_at) }}</p>
      </div>
      <button class="btn-icon text-danger/70 hover:text-danger"
              (click)="deleteSession(session.id)"
              matTooltip="Delete session">
        <mat-icon>delete</mat-icon>
      </button>
    </li>
  } @empty {
    <p class="text-slate text-sm py-4">No sessions yet.</p>
  }
</ul>
