<h2 class="font-brand text-xl text-parchment mb-1">Starting Equipment</h2>
<p class="text-sm text-slate mb-4">Select items to add to your character's inventory.</p>
<div class="flex flex-col gap-1.5 max-w-2xl">
  @for (item of items(); track item.index) {
    <button
      class="flex items-center justify-between px-4 py-3 rounded-md border transition-all cursor-pointer text-left w-full"
      [class]="selectedItemIndices().has(item.index)
        ? 'border-gold/60 bg-gold/5'
        : 'border-white/10 hover:border-white/25'"
      (click)="itemToggled.emit(item.index)"
      style="background: transparent; font-family: inherit;"
    >
      <div class="flex items-center gap-3">
        <span class="font-medium text-sm" [class]="selectedItemIndices().has(item.index) ? 'text-parchment' : 'text-slate'">{{ item.name }}</span>
        @if (selectedItemIndices().has(item.index)) {
          <span class="text-gold text-xs">✓</span>
        }
      </div>
      <div class="flex items-center gap-2 flex-shrink-0 ml-4 text-xs text-coal">
        <span>{{ item.category }}</span>
        @if (item.damage) { <span>{{ item.damage }} {{ item.damage_type }}</span> }
        @if (item.armor_class) { <span>AC {{ item.armor_class }}</span> }
        <span>{{ item.cost }}</span>
      </div>
    </button>
  }
</div>
@if (selectedItemIndices().size) {
  <p class="text-sm text-slate mt-4">
    <span class="text-gold font-medium">{{ selectedItemIndices().size }}</span> item(s) selected
  </p>
}
