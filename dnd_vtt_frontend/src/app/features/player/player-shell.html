<div class="flex flex-col h-screen">
  <header class="app-toolbar">
    <span class="toolbar-title">D&amp;D Campaign</span>

    <nav class="flex gap-1 mx-auto">
      <button class="btn-ghost text-sm gap-1.5"
              [class.bg-white/10]="activeTab() === 'create'"
              (click)="activeTab.set('create')">
        <mat-icon class="text-base">create</mat-icon> Create
      </button>
      <button class="btn-ghost text-sm gap-1.5"
              [class.bg-white/10]="activeTab() === 'play'"
              (click)="activeTab.set('play')">
        <mat-icon class="text-base">play_arrow</mat-icon> Play
      </button>
    </nav>

    <div class="flex items-center gap-2 ml-auto">
      <span class="text-sm text-slate">{{ auth.profile()?.username }}</span>
      <span class="toolbar-badge">Player</span>
      <button class="btn-icon" (click)="auth.signOut()" matTooltip="Sign out">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </header>

  <div class="flex-1 overflow-hidden flex flex-col min-h-0">
    @if (activeTab() === 'create') {
      <app-dm-characters class="flex flex-col flex-1 min-h-0" />
    } @else {
      <app-player-play class="flex-1 min-h-0" />
    }
  </div>
</div>
