<div class="card card-body">
  <div class="flex items-center mb-3 gap-2">
    <h3 class="text-sm font-semibold text-gold uppercase tracking-wide flex-1 m-0">
      {{ title() }}@if (required()) { <span class="text-danger">*</span> }
    </h3>
    <button class="btn-icon" type="button" (click)="add()" [title]="'Add ' + title().toLowerCase()">
      <mat-icon class="text-base">add</mat-icon>
    </button>
  </div>
  @if (entries().length === 0) {
    <p class="text-slate text-xs m-0">None yet.</p>
  }
  <div class="flex flex-col gap-3">
    @for (entry of entries(); track $index) {
      <div class="flex flex-col gap-2 border border-white/10 rounded p-3">
        <div class="flex items-center gap-2">
          <input class="field-input flex-1" [ngModel]="entry.name" (ngModelChange)="update($index, { name: $event })" [placeholder]="placeholder()" name="name{{ $index }}" />
          <button class="btn-icon" type="button" (click)="remove($index)" title="Remove">
            <mat-icon class="text-base">close</mat-icon>
          </button>
        </div>
        <textarea class="field-input" rows="2" [ngModel]="entry.description" (ngModelChange)="update($index, { description: $event })" placeholder="Description" name="desc{{ $index }}"></textarea>
      </div>
    }
  </div>
</div>
