name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dnd_vtt_backend/package-lock.json

      - name: Install backend dependencies
        working-directory: dnd_vtt_backend
        run: npm ci

      - name: Run backend unit tests
        working-directory: dnd_vtt_backend
        run: npm test
